name: Diagnóstico de fuentes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnostico.yml", "scripts/sondeo.py"]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sondeo.py
      - run: |
          git config user.name "Comprobador de boletos (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add debug
          git commit -m "Diagnóstico de fuentes" || true
          git pull --rebase origin main && git push origin main
