name: Actualizar resultados oficiales
# Es comproven l'Euromilions (divendres), la Primitiva (dissabte) i els sortejos extraordinaris de l'ONCE.
# GitHub salta sovint les tasques programades; per això cada nit té diverses arrencades de
# reserva i la primera que arrenca es queda vigilant (scripts/vigilar.py).
# Hores en UTC (Madrid = UTC+1 a l'hivern, UTC+2 a l'estiu).
on:
  schedule:
    - cron: "41 18 * * 5,6"          # divendres i dissabte: vigilància nocturna (fins a les 00:40 UTC)
    - cron: "13 19,20,21,22 * * 5,6" # reserves de la vigilància
    - cron: "17 6,8,10 * * 6,0"      # dissabte i diumenge al matí: escrutinis endarrerits
    - cron: "23 21 * * *"            # cada nit: extraordinaris de l'ONCE (11 de l'11, Nadal…)
    - cron: "37 7 * * *"             # cada matí: repàs
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/actualizar.py", "scripts/vigilar.py", ".github/workflows/resultados.yml"]
permissions:
  contents: write
concurrency:
  group: resultados
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      JOCS: "EMIL,LAPR,ONCEX"
    steps:
      - uses: actions/checkout@v4
      - name: Vigilar i publicar resultats
        run: |
          git config user.name "Comprobador de boletos (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          H=$(date -u +%H)
          if [ "$H" -ge 18 ]; then export FINS_UTC="00:40"; fi
          python3 scripts/vigilar.py
